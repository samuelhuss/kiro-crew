<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS Migration Console</title>
  <style>
    :root {
      --bg:#0f1420; --panel:#1a2030; --border:#2a3244; --text:#e2e8f0;
      --muted:#94a3b8; --accent:#38bdf8; --ok:#34d399; --err:#f87171; --pending:#475569;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:24px; }
    h1 { font-size:20px; } .sub { color:var(--muted); margin-bottom:20px; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:16px; }
    .panel h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:14px; }
    .row { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; }
    .col { flex:1; min-width:180px; }
    label { display:block; font-size:12px; color:var(--muted); margin:6px 0 4px; }
    input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 10px; color:var(--text); font:inherit; }
    button { background:var(--accent); color:#04121f; border:none; border-radius:6px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
    button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
    button:disabled { opacity:.4; cursor:not-allowed; }
    .arrow { font-size:22px; color:var(--accent); align-self:center; }
    .pipeline { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .stage { display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:20px; border:1px solid var(--border); font-size:13px; }
    .stage .dot { width:8px; height:8px; border-radius:50%; background:var(--pending); }
    .stage.done .dot { background:var(--ok); }
    .stage.active .dot { background:var(--accent); animation:pulse 1s infinite; }
    @keyframes pulse { 50% { opacity:.4; } }
    .streams { display:flex; gap:16px; flex-wrap:wrap; }
    .stream { flex:1; min-width:300px; }
    pre { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:12px; height:280px; overflow:auto; font-size:12px; white-space:pre-wrap; word-break:break-word; }
    .composer { display:flex; gap:8px; margin-top:12px; }
    .composer input { flex:1; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <h1>AWS Migration Console</h1>
  <div class="sub">Visual do orquestrador — você vê tudo que o agente faz, em tempo real</div>

  <!-- SETUP -->
  <div class="panel">
    <h2>Migração</h2>
    <div class="row">
      <div class="col"><label>Source region</label><input id="src-region" value="us-east-1"></div>
      <div class="arrow">▶</div>
      <div class="col"><label>Target region</label><input id="tgt-region" value="sa-east-1"></div>
      <div class="col"><label>Target account (cross-account, opcional)</label><input id="tgt-account" placeholder="123456789012"></div>
      <div><button id="btn-start">Iniciar</button></div>
    </div>
  </div>

  <!-- PIPELINE + STREAMS -->
  <div class="panel hidden" id="pipeline-panel">
    <h2>Pipeline</h2>
    <div class="pipeline">
      <div class="stage" data-stage="discovery"><span class="dot"></span>Discovery</div>
      <div class="stage" data-stage="graph"><span class="dot"></span>Graph</div>
      <div class="stage" data-stage="assessment"><span class="dot"></span>Assessment</div>
      <div class="stage" data-stage="cfn"><span class="dot"></span>Faithful CFN</div>
    </div>

    <div class="streams">
      <div class="stream">
        <label>Narração do orquestrador</label>
        <pre id="narration"></pre>
      </div>
      <div class="stream">
        <label>Tool calls (o que ele executa)</label>
        <pre id="toolcalls"></pre>
      </div>
    </div>

    <div class="composer">
      <input id="composer" placeholder="Mande uma mensagem ao orquestrador…">
      <button id="btn-send" disabled>Enviar</button>
    </div>
    <div style="margin-top:12px">
      <button id="btn-approve" class="secondary">✅ Pode executar a migração</button>
      <button id="btn-cancel" class="secondary">⏹ Cancelar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
